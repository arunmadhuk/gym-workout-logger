{% extends 'index.html' %}
{% load static %}

{% block title %}{{ title }} - Fitness Tracker{% endblock %}

{% block content %}
<style>
    .exercise-formset {
        border-left: 3px solid #007bff;
        margin-bottom: 20px;
    }
    .formset-row {
        background-color: #f8f9fa;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 5px;
        transition: all 0.3s;
    }
    .formset-row:hover {
        background-color: #e9ecef;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .delete-row {
        margin-top: 30px;
    }
    .duration-help {
        font-size: 0.875rem;
        color: #6c757d;
        margin-top: 5px;
    }
    .calories-info {
        background-color: #e7f3ff;
        border-left: 4px solid #007bff;
        padding: 10px;
        margin-top: 10px;
        border-radius: 4px;
    }
</style>



<div class="container mt-4">
    <div class="row">
        <div class="col-md-10">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">{{ title }}</h3>
                </div>
                <form class="needs-validation" method="post" id="workout-form" novalidate>
                    {% csrf_token %}
                    <div class="card-body">
                        <!-- Workout Session Section -->
                        <div class="card mb-4">
                            <div class="card-header bg-info text-white">
                                <h5 class="mb-0">Session Information</h5>
                            </div>
                            <div class="card-body">
                                <!--first row-->
                                <div class="row">
                                    <div class="col-md-4">
                                        <label for="session_date" class="form-label">Session Date</label>
                                        <input type="date" class="form-control" id="session_date" placeholder="Session Date" onfocus="this.max=new Date().toISOString().split('T')[0]" 
                                            onfocusout="validateDate()" required value="{{ form.session_date.value|date:'Y-m-d' }}">
                                        <div class="invalid-feedback session-date-feedback">
                                            Select a Valid Date.
                                        </div>
                                    </div>
                                    
                                    <div class="col-md-4">
                                        <label for="start_time" class="form-label">Start Time</label>
                                        <input type="time" class="form-control" id="start_time" placeholder="Start Time" required value="{{ form.start_time.value|time:'H:i' }}">
                                        <div class="invalid-feedback start-time-feedback">
                                            Select a Valid Time.
                                        </div>
                                    </div>

                                    <div class="col-md-4">
                                        <label for="end_time" class="form-label">End Time</label>
                                        <input type="time" class="form-control" id="end_time" placeholder="End Time" onfocusout="validateTime()" required value="{{ form.end_time.value|time:'H:i' }}">
                                        <div class="invalid-feedback end-time-feedback">
                                            Select a Valid Time.
                                        </div>
                                    </div>
                                </div>
                                <!--second row-->
                                <div class="row">
                                    <div class="col-md-4">
                                        <label for="calories_burned" class="form-label">Calories Burned</label>
                                        <input type="number" class="form-control" id="calories_burned" placeholder="Calories Burned" min="0" value="{{ form.calories_burned.value|default:'' }}">
                                    </div>
                                    
                                    <div class="col-md-8">
                                        <label for="notes" class="form-label">Notes</label>
                                        <textarea class="form-control" id="notes" rows="1">{{ form.notes.value|default:'' }}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Exercise Logs Section -->
                        <div class="card mb-4">
                            <div class="card-header bg-success text-white">
                                <h5 class="mb-0">Exercise Logs</h5>
                            </div>
                            <div class="card-body">                  
                                <div id="exercises-forms-container">  
                                    <!--First Row-->
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Exercise * {{exercise_form.exercise.value}}</label>
                                            <select class="form-select" aria-label="Choose an exercise" id="exercise_name" name="{{ exercise_form.exercise.html_name }}" required onchange="loadSelectedExercise(this)">
                                                <option value="" selected disabled>Choose an exercise</option>
                                                {% for exercise in exercises %}
                                                    <option value="{{ exercise.id }}" {% if exercise_form.exercise.value == exercise.exercise_id %}selected{% endif %}>
                                                        {{ exercise.name }}
                                                    </option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">Duration (minutes)</label>
                                            <input type="number" class="form-control" id="duration_minutes" name="{{ exercise_form.duration_minutes.html_name }}" min="0" value="{{ exercise_form.duration_minutes.value}}">
                                        </div>
                                    </div>
                                    <!--Second Row-->
                                    <div class="row">
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">Sets *</label>
                                            <input type="number" class="form-control" id="sets" name="{{ exercise_form.sets.html_name }}" min="1" value="{{ exercise_form.sets_completed.value }}">
                                        </div>
                                        
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">Reps *</label>
                                            <input type="number" class="form-control" id="reps" name="{{ exercise_form.reps.html_name }}" min="1" value="{{ exercise_form.reps_completed.value }}">
                                        </div>
                                        
                                        <div class="col-md-3 mb-3" id="weight_kg_div">
                                            <label class="form-label">Weight (kg)</label>
                                            <input type="number" class="form-control" id="weight_kg" name="{{ exercise_form.weight_kg.html_name }}" min="0" value="{{ exercise_form.weight_kg.value }}">
                                        </div>
                                        
                                        <div class="col-md-3 mb-3" id="distance_km_div">
                                            <label class="form-label">Distance (km)</label>
                                            <input type="number" class="form-control" id="distance_km" name="{{ exercise_form.distance_km.html_name }}" min="0" value="{{ exercise_form.distance_km.value|default:'' }}">
                                        </div>
                                    </div>
                                    <!--Third Row-->
                                    <div class="row">
                                        <div class="col-md-9 mb-3">
                                            <label class="form-label">Exercise Notes</label>
                                                <textarea class="form-control" id="exercise_notes" name="{{ exercise_form.notes.html_name }}" rows="2">{{ exercise_form.notes.value|default:'' }}</textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    
                        <!-- Action Buttons -->
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <a href="{% url 'workout-session-list' %}" class="btn btn-secondary btn-md">
                            <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                            <button type="button" class="btn btn-primary btn-md" onclick="updateWorkoutSession(event)">
                                <i class="bi bi-save"></i> Update Workout Session
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
let session_id = {{session_id}}
window.show_toast = function(message) {
    // Check if toast element exists
    if ($('#liveToast').length) {
        $('#toast-body').html(message);
        var toast = new bootstrap.Toast(document.getElementById('liveToast'));
        toast.show();
    } else {
        alert(message); // Fallback if toast doesn't exist
    }
}

$(document).ready(function() {
    $('#staticBackdrop').on('hidden.bs.modal', function (e) {
       //location.reload();
        console.log("workout-session-list")
        window.location.href = "{% url 'workout-session-list' %}";
    });
    });
    
window.show_modal = function(title, body) {
    if ($('#modal-title').length && $('#body-modal').length) {
        $('#modal-title').text(title);
        $('#body-modal').text(body);
        var myModal = new bootstrap.Modal(document.getElementById('staticBackdrop'), {
            keyboard: false
        });
        myModal.show();
    }
}

    function updateDeleteButtonState(count) {

    let deleteBtn = document.getElementById('delete-exercise-btn');
    if (count === 1) {
        deleteBtn.disabled = true;
        deleteBtn.classList.remove('btn-outline-danger');
        deleteBtn.classList.add('btn-outline-secondary');
    }
    else {
        deleteBtn.disabled = false;
        deleteBtn.classList.remove('btn-outline-secondary');
        deleteBtn.classList.add('btn-outline-danger');
    }
    }

function validateDate() {
    let sess_date = document.querySelector('#session_date');
    console.log("Validating Date: " + sess_date.value);
    let today = new Date().toISOString().split('T')[0];
    if (sess_date.value) {
        console.log("Session Date: " + sess_date.value + ", Today's Date: " + today);

            if (sess_date.value > today) {
        sess_date.setCustomValidity("Session date cannot be in the future.");
        $('#session_date').addClass('is-invalid');
        $('.session-date-feedback').text("Session date cannot be in the future.");
    } else {
        sess_date.setCustomValidity("");
        $('#session_date').removeClass('is-invalid').addClass('is-valid');
        $('.session-date-feedback').text("Select a Valid Date.");
    }
    }
    else {
        console.log("Session date is empty.");
        $('#session_date').addClass('is-invalid').removeClass('is-valid');
        $('.session-date-feedback').text("Session date is invalid.");
    }

}

function validateTime() {
    let strt_time = document.querySelector('#start_time');
    let ed_time = document.querySelector('#end_time');
    if (strt_time.value && ed_time.value && strt_time.value >= ed_time.value) {
        ed_time.setCustomValidity("End time must be after start time.");
        $('#end_time').addClass('is-invalid');
        $('.end-time-feedback').text("End time must be after start time.");
    } else {
        ed_time.setCustomValidity("");
        $('#end_time').removeClass('is-invalid');
        $('.end-time-feedback').text("Select a Valid Time.");
    }
}


  window.updateWorkoutSession = function(event) {
    console.log("form validator")

    'use strict'

    var form = document.querySelector('.needs-validation');
      if (!form) {
        console.error("Form not found");
        return false;
      }
      
      // Check validity
      if (form.checkValidity() === false) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
        console.log("Form validation failed");
        show_toast("Please fill in all required fields correctly.");
        return false;
      }


    let sess_date = document.querySelector('#session_date');
    let strt_time = document.querySelector('#start_time');
    let ed_time = document.querySelector('#end_time');
    let exercise = document.querySelector('#exercise_name');
    console.log('Exercise name:', exercise.value);
    console.log("Session Date Validity: " + sess_date.checkValidity());
    console.log("Start Time Validity: " + strt_time.checkValidity());
    console.log("End Time Validity: " + ed_time.checkValidity());
    console.log("Exercise Validity: " + exercise.checkValidity());
    if (sess_date.checkValidity() == true && strt_time.checkValidity() == true && ed_time.checkValidity() && exercise.checkValidity()) {
        var session_date = ($('#session_date')).val();
        var start_time = ($('#start_time')).val();
        var end_time = ($('#end_time')).val();
        var calories_burned = ($('#calories_burned')).val();
        var notes = ($('#notes')).val();

        var exercise_name = $('#exercise_name option:selected').text().trim();
        var sets = $('#sets').val() || 0;
        var reps = $('#reps').val() || 0;
        var weight_kg = $('#weight_kg').val() || 0;
        var duration_minutes = $('#duration_minutes').val() || 0;
        var distance_km = $('#distance_km').val() || '';
        var exercise_notes = ($('#exercise_notes')).val();

        

        console.log("Session Date : "+ session_date+", Start Time : "+ start_time+" , End Time : "+end_time)
        console.log("Exercise Name : "+ exercise_name+", Sets : "+ sets+" , Reps : "+reps+", Weight (kg) : "+ weight_kg+", Duration (minutes) : "+ duration_minutes+", Distance (km) : "+ distance_km+", Exercise Notes : "+ exercise_notes)    
        $.ajax({
        url: "{% url 'workout-edit' session_id %}",
        type: "POST",
        contentType: 'application/json',
        data: JSON.stringify({
            workout_data :{
            'session_date': session_date,
            'start_time': start_time,
            'end_time':end_time,
            'calories_burned':calories_burned,
            'notes':notes,
            },
            exercise_data : {
                'exercise_name': exercise_name,
                'sets_completed': sets,
                'reps_completed': reps,
                'weight_kg': weight_kg,
                'duration_minutes': duration_minutes,
                'distance_km': distance_km,
                'exercise_notes': exercise_notes,
            },
            'csrfmiddlewaretoken': '{{ csrf_token }}'
        }),
         headers: {
        'X-CSRFToken': '{{ csrf_token }}'  // Alternative CSRF placement
    },
        success: function (response) {
            show_modal("Workout session updated successfully!", "The workout session has been updated.");

        },
        error: function (xhr, status, error) {
            console.log("AJAX Error:", status, error);
        
        if (xhr.status === 400) {
            // Validation errors
            const response = xhr.responseJSON;
            let errorMessage = "Please fix the following errors:"+`<br>`;
            
            if (response.workout_errors) {
               
                errorMessage += "Workout Session Errors:&nbsp";
                for (const [field, errors] of Object.entries(response.workout_errors)) {
                    errorMessage += `- ${field}: ${errors.join(', ')}\n`;
                }
            }
            
            if (response.exercise_errors) {
                 errorMessage += '<br>'
                errorMessage += "Exercise Errors:&nbsp";
                for (const [field, errors] of Object.entries(response.exercise_errors)) {
                    errorMessage += `- ${field}: ${errors.join(', ')}\n`;
                }
            }
            
            if (response.non_field_errors) {
                errorMessage += `\n${response.non_field_errors.join('\n')}\n`;
            }
            
            show_toast(errorMessage);
            
        } else {
            show_toast("Error updating workout session. Please try again.");
        }
        }
        });
         return false;
    }

  }

    // Calculate duration preview (optional)
    const startTimeInput = document.getElementById('{{ form.start_time.id_for_label }}');
    const endTimeInput = document.getElementById('{{ form.end_time.id_for_label }}');
    const dateInput = document.getElementById('{{ form.session_date.id_for_label }}');
    
    function previewDuration() {
        if (startTimeInput.value && endTimeInput.value && dateInput.value) {
            // You can add AJAX call here to preview duration
            console.log('Duration will be calculated on save');
        }
    }
    
    startTimeInput?.addEventListener('change', previewDuration);
    endTimeInput?.addEventListener('change', previewDuration);
    
    // Confirmation before submit
    document.getElementById('workout-form').addEventListener('submit', function(e) {
        const startTime = startTimeInput?.value;
        const endTime = endTimeInput?.value;
        
        if (startTime && endTime && startTime === endTime) {
            if (!confirm('Start and end times are the same. Duration will be 0 minutes. Continue?')) {
                e.preventDefault();
            }
        }
    });


    function loadSelectedExercise(selectElement) {
        const exerciseId = selectElement.value;
        const exercise_name = selectElement.options[selectElement.selectedIndex].text;
        if (exercise_name) {
            // Optional: Fetch exercise details via AJAX to show recommendations
            console.log('Selected Exercise ID:', exercise_name);
              $.ajax({
                type: "GET",
                url: "/load-selected-exercise-ajax/",
                data: {
                exercise_name: exercise_name,
                },
                success: function (data) {
                    console.log('Received data:', data);

                    $('#sets').val(data.sets);
                    $('#reps').val(data.reps);
                    $('#duration_minutes').val(data.duration_minutes);

                    if (data.weight_kg !== null) {
                        $('#weight_kg_div').show();
                        $('#weight_kg').val(data.weight_kg);
                    } else {
                        $('#weight_kg_div').hide();
                    }
                    if (data.distance_km !== null) {
                        $('#distance_km_div').show();
                        $('#distance_km').val(data.distance_km);
                    } else {
                        $('#distance_km_div').hide();
                    }
                },
                error: function (response) {
                    console.log(response);
                },
            });
        }
    }
</script>
{% endblock %}
